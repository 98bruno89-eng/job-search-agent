name: Run Job Search Pipeline

on:
  schedule:
    # Runs every day at 13:00 UTC (adjust to your timezone preference)
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}  # lets you trigger it manually from the GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/main.py
